[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name (plain "folio" is taken by an unrelated static-site tool).
# Import package + CLI command remain `folio`.
name = "folio-cli"
version = "0.4.2"
description = "Local hybrid RAG for AI engineering / MLOps / infra decisions — bounded CLI output for any assistant"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Iman Sharei" }]
keywords = [
  "rag",
  "mlops",
  "ai-engineering",
  "chromadb",
  "cli",
  "uv",
  "agent-skills",
  "cursor",
  "claude-code",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "chromadb>=0.5.23,<1.1",
  "rank-bm25>=0.2.2",
  "PyYAML>=6.0.2",
  "tqdm>=4.66.0",
  "numpy>=1.26.0,<3",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.3.0,<6"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.urls]
Homepage = "https://github.com/Iman-Sharei/folio"
Repository = "https://github.com/Iman-Sharei/folio"
Issues = "https://github.com/Iman-Sharei/folio/issues"
Changelog = "https://github.com/Iman-Sharei/folio/releases"

[project.scripts]
folio = "folio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
folio = ["assets/*"]

[tool.uv]
package = true
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests that embed with Chroma ONNX (slower)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
