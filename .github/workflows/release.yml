name: Release

# Tag pushes must not rebuild folio-index.tar.gz. The old job downloaded the
# previous release asset and uploaded that re-pack, which replaced a freshly
# uploaded database with the previous bytes. Publish the index by hand:
#   gh release upload <tag> dist/folio-index.tar.gz --clobber
on:
  push:
    tags: ["v*"]

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - name: Index pack is not built here
        run: echo "folio-index.tar.gz is uploaded separately and is not rebuilt from the previous release."
