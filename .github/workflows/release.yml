name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish-index-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install folio
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Build index from curated sources
        run: |
          export FOLIO_HOME="${RUNNER_TEMP}/folio-home"
          folio build
          folio status
          folio pack --dest dist/folio-index.tar.gz
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/folio-index.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
