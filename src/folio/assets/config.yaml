# Hybrid RAG — curated AI eng / MLOps / AI infra curricula
# BM25 + dense → RRF → CRAG widen → optional cross-encoder rerank

sources:
  # --- already trusted (user seeds) ---
  - id: senior-ai-revision
    repo: https://github.com/RavSinghChandan/02-senior-ai-engineer-study-path.git
    sparse_path: revision-1
    branch: main
  - id: ai-infra-lessons
    repo: https://github.com/ai-infra-curriculum/ai-infra-senior-engineer-learning.git
    sparse_path: lessons
    branch: main

  # --- same curriculum factory (MD lessons, senior depth) ---
  - id: agentic-ai-developer
    repo: https://github.com/ai-engineering-curriculum/agentic-ai-developer-learning.git
    sparse_path: lessons
    branch: main
  - id: agentic-ai-engineer
    repo: https://github.com/ai-engineering-curriculum/agentic-ai-engineer-learning.git
    sparse_path: lessons
    branch: main
  - id: senior-agentic-ai-engineer
    repo: https://github.com/ai-engineering-curriculum/senior-agentic-ai-engineer-learning.git
    sparse_path: lessons
    branch: main
  - id: applied-ai-engineer
    repo: https://github.com/ai-engineering-curriculum/applied-ai-engineer-learning.git
    sparse_path: lessons
    branch: main
  - id: ai-eval-engineer
    repo: https://github.com/ai-engineering-curriculum/ai-eval-engineer-learning.git
    sparse_path: lessons
    branch: main
  - id: agentic-systems-architect
    repo: https://github.com/ai-engineering-curriculum/agentic-systems-architect-learning.git
    sparse_path: lessons
    branch: main

  # --- classic MLOps course (markdown-heavy modules) ---
  - id: mlops-zoomcamp
    repo: https://github.com/DataTalksClub/mlops-zoomcamp.git
    sparse_path: .
    branch: main

release:
  # Filled after first GitHub Release upload of folio-index.tar.gz
  index_url: "https://github.com/Iman-Sharei/folio/releases/latest/download/folio-index.tar.gz"

paths:
  sources_dir: data/sources
  chroma_dir: data/chroma
  bm25_path: data/bm25/index.json
  manifest_path: data/manifest.json

chunking:
  max_chars: 1200
  overlap_chars: 150
  min_chars: 80

embedding:
  model: onnx-minilm-l6-v2
  batch_size: 64

collection:
  name: folio_knowledge

retrieval:
  dense_k: 20
  bm25_k: 20
  final_k: 8
  rrf_k: 60
  crag_min_best_score: 0.012
  crag_widen_factor: 2
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  confidence_floor: 0.008
